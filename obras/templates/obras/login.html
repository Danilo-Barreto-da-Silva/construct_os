{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Restrito | SGO.IA Construtora & Engenharia</title>
    <link rel="stylesheet" href="{% static 'obras/css/tailwind.min.css' %}">
    <link rel="stylesheet" href="{% static 'obras/vendor/fontawesome/css/all.min.css' %}">
    <style>
        body {
            background-color: #060a12;
            background-image: 
                radial-gradient(at 15% 15%, rgba(6, 182, 212, 0.12) 0px, transparent 50%),
                radial-gradient(at 85% 85%, rgba(245, 158, 11, 0.10) 0px, transparent 50%),
                linear-gradient(rgba(30, 41, 59, 0.25) 1px, transparent 1px),
                linear-gradient(90deg, rgba(30, 41, 59, 0.25) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 36px 36px, 36px 36px;
        }
        .logo-glow {
            box-shadow: 0 0 25px rgba(6, 182, 212, 0.35);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 text-slate-100 font-sans">

    <div class="max-w-md w-full bg-[#0d1424]/90 backdrop-blur-xl border border-slate-800 rounded-2xl p-8 shadow-2xl">
        
        <!-- LOGO DA EMPRESA -->
        <div class="flex flex-col items-center text-center mb-8">
            <div class="w-20 h-20 rounded-2xl bg-gradient-to-br from-cyan-500/20 to-amber-500/20 border-2 border-cyan-400 flex items-center justify-center logo-glow mb-4 relative">
                <!-- Ícone Vetorial de Prédio + IA -->
                <svg class="w-11 h-11 text-cyan-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 21h18M5 21V7l8-4v18M19 21V11l-6-4M9 9v.01M9 12v.01M9 15v.01M9 18v.01"/>
                </svg>
                <span class="absolute -bottom-2 -right-2 bg-amber-500 text-slate-950 text-[10px] font-black px-1.5 py-0.5 rounded shadow">
                    IA
                </span>
            </div>

            <h1 class="text-2xl font-black tracking-wider text-white">
                HORIZONTE <span class="text-cyan-400">ENGENHARIA</span>
            </h1>
            <p class="text-xs font-mono text-slate-400 mt-1 uppercase tracking-widest">
                SGO.IA • Controle de Obras & ISO 9001
            </p>
        </div>

        <!-- ALERTA DE ERRO DE SENHA -->
        {% if erro %}
        <div class="bg-rose-950/60 border border-rose-500/60 text-rose-200 text-xs p-3 rounded-lg mb-5 flex items-center gap-2">
            <i class="fa-solid fa-circle-exclamation text-rose-400 text-sm"></i>
            <span>{{ erro }}</span>
        </div>
        {% endif %}

        <!-- FORMULÁRIO DE LOGIN -->
        <form method="POST" class="space-y-5">
            <input type="hidden" name="next" value="{{ next }}">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">
                    <i class="fa-solid fa-user-shield text-cyan-400 mr-1"></i> Usuário de Acesso
                </label>
                <input type="text" name="username" placeholder="Digite seu usuário" autocomplete="username" required autofocus
                    class="w-full bg-[#070b14] border border-slate-700 focus:border-cyan-400 rounded-xl px-4 py-3 text-sm text-white outline-none transition">
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">
                    <i class="fa-solid fa-lock text-amber-400 mr-1"></i> Senha Corporativa
                </label>
                <input type="password" name="password" autocomplete="current-password" placeholder="••••••••" required
                    class="w-full bg-[#070b14] border border-slate-700 focus:border-cyan-400 rounded-xl px-4 py-3 text-sm text-white outline-none transition">
            </div>

            <button type="submit"
                class="w-full bg-gradient-to-r from-cyan-500 to-sky-500 hover:from-cyan-400 hover:to-sky-400 text-slate-950 font-black py-3 rounded-xl text-sm uppercase tracking-wider transition shadow-lg">
                Entrar no Painel da Obra <i class="fa-solid fa-arrow-right ml-1"></i>
            </button>
        </form>

        <!-- RODAPÉ DE SEGURANÇA -->
        <div class="mt-7 pt-5 border-t border-slate-800/80 text-center space-y-1">
            <p class="text-[11px] text-slate-500">
                <i class="fa-solid fa-shield-halved text-emerald-400 mr-1"></i> Ambiente Restrito — Auditoria ISO 9001:2015
            </p>
        </div>
    </div>

</body>
</html>
