<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Construct OS{% endblock %} | SGO.IA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #090e17; color: #e2e8f0; }
        .panel { background: #11192c; border: 1px solid #243247; border-radius: .85rem; }
        .btn { display: inline-flex; align-items: center; justify-content: center; border-radius: .6rem; font-size: .875rem; font-weight: 700; padding: .65rem 1rem; }
        .btn-primary { background: #22d3ee; color: #07121e; }
        .btn-muted { background: #1e293b; color: #e2e8f0; }
        label { color: #a5b4cf; font-size: .85rem; }
        .errorlist { color: #fda4af; font-size: .85rem; margin: .3rem 0; }
        form p { margin-bottom: .9rem; }
        form p label { display: block; margin-bottom: .35rem; }
        form p input, form p textarea, form p select { width: 100%; background: #090e17; border: 1px solid #475569; border-radius: .5rem; padding: .55rem .75rem; color: white; }
    </style>
</head>
<body class="min-h-screen">
    <header class="bg-[#0d1424] border-b border-slate-800">
        <div class="max-w-6xl mx-auto flex flex-wrap gap-3 justify-between items-center px-5 py-4">
            <a href="{% url 'painel_principal' %}" class="font-extrabold text-cyan-400 tracking-wider">SGO.IA <span class="text-slate-400 font-normal text-xs">/ QUALIDADE & PLANEJAMENTO</span></a>
            <nav aria-label="Navegação principal" class="flex items-center flex-wrap gap-3 text-sm">
                <a class="hover:text-cyan-300" href="{% url 'painel_principal' %}">Painel</a>
                <a class="hover:text-cyan-300" href="{% url 'lista_rncs' %}">RNCs</a>
                <a class="hover:text-cyan-300" href="{% url 'planejamento' %}">Planejamento</a>
                {% if request.user.is_staff %}<a class="hover:text-cyan-300" href="{% url 'cadastros' %}">Cadastros</a><a class="hover:text-cyan-300" href="{% url 'relatorios' %}">Relatórios</a>{% endif %}
                <form method="post" action="{% url 'logout_sistema' %}" class="inline">
                    {% csrf_token %}
                    <button class="text-rose-300 hover:text-rose-200" type="submit">Sair</button>
                </form>
            </nav>
        </div>
    </header>
    <main class="max-w-6xl mx-auto p-5 md:py-8 space-y-6">
        {% for message in messages %}
        <p role="status" class="panel p-4 text-sm border-l-4 border-cyan-400">{{ message }}</p>
        {% endfor %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
