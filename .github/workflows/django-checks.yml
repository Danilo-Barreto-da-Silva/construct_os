name: Django checks
on:
  pull_request:
  push:
    branches: [main, 'refactor/**']
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile pinned static assets
        run: |
          npm ci --no-audit --no-fund
          npm run build:assets
          test -s obras/static/obras/css/tailwind.min.css
          test -s obras/static/obras/vendor/apexcharts/apexcharts.min.js
          test -s obras/static/obras/vendor/three/build/three.module.js
          test -s obras/static/obras/vendor/fontawesome/css/all.min.css
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Django checks and tests
        env:
          DJANGO_SECRET_KEY: ci-only-testing-m4w8rQ3s6aD2eF9gH7jK5mN1pR8tU4vW6xY0zA2bC9dE3fG7hI5
          DJANGO_DEBUG: '0'
          DJANGO_ALLOWED_HOSTS: localhost,testserver
          DJANGO_SECURE_SSL_REDIRECT: '0'
          DJANGO_SMTP_HOST: smtp.test.invalid
          GEMINI_API_KEY: MODO_SIMULACAO
        run: |
          python manage.py collectstatic --noinput --clear --verbosity 0
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py test
          # Preload / includeSubdomains do HSTS exigem domínio validado.
          # Os avisos W005 e W021 são deliberados nesta fase; zero ERROS.
          DJANGO_SECURE_SSL_REDIRECT=1 python manage.py check --deploy --fail-level ERROR
